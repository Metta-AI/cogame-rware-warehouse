# ONE service, underscored: the manifest's image placeholder is DERIVED from
# the compose service name (`service rware_warehouse` -> `{{RWARE_WAREHOUSE_IMAGE}}`).
# `{{GAME_IMAGE}}` is not a thing (lantern 0.1.0). One image with two
# entrypoints, because the shared tools/ci/docker_smoke.sh and
# tools/ci/policies.json both assume a single image.
services:
  rware_warehouse:
    image: coworld-rware-warehouse:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      network: host
